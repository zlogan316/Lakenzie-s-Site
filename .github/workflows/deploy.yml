# INERT until AWS is provisioned — requires repo secrets; safe to merge.
#
# The job is gated on the repo *variable* DEPLOY_ENABLED == 'true', so this
# workflow skips (never fails) until the Lightsail box exists and the
# LIGHTSAIL_HOST / LIGHTSAIL_SSH_KEY secrets are set. See deploy/README.md.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/zlogan316/lakenzie-site-api
  WEB_IMAGE: ghcr.io/zlogan316/lakenzie-site-web

jobs:
  build-and-deploy:
    # Gate: never runs (and never fails) until DEPLOY_ENABLED is set to 'true'.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /opt/lakenzie
            docker compose pull
            docker compose up -d
