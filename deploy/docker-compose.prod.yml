# =============================================================================
# PRODUCTION ONLY — INERT until Phase 2. Not used in local dev.
#
# Runs on the Lightsail box at /opt/lakenzie. Images are built and pushed to
# GHCR by .github/workflows/deploy.yml; this file just pulls and runs them.
# Expects a .env file alongside it on the server (DATABASE_URL, SA_PASSWORD).
# =============================================================================

services:
  web:
    image: ghcr.io/zlogan316/lakenzie-site-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist certificates and Caddy state across container replacements,
      # otherwise every deploy re-requests certs (and hits LE rate limits).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/zlogan316/lakenzie-site-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      # Cap SQL Server's memory so it coexists with the apps on a 2 GB box.
      MSSQL_MEMORY_LIMIT_MB: "1200"
      SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  caddy-data:
  caddy-config:
  mssql-data:
